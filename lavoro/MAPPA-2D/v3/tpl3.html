<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Tuscany – Mappa dei tour</title>
<style>%FACES%
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:'Architects Daughter',cursive;color:#333;overflow:hidden}
header{height:64px;background:#0a0808;display:flex;align-items:center;gap:16px;padding:0 20px}header img{height:40px}header h1{margin:0;font:400 24px 'Schoolbell';color:#fff;flex:1}header h1 span{color:#758d15}
#wrap{position:relative;height:calc(100vh - 64px);overflow:hidden}#outer,#innerL{position:absolute;inset:0;width:100%;height:100%}#innerL{background:#fff;opacity:0;pointer-events:none}#inner{width:100%;height:100%;display:block}
.ic{font-family:'%FA%';font-size:21px;fill:#fff}.ban{font:400 26px 'Schoolbell';fill:#fff;letter-spacing:1px}.ban.s{font-size:16px}.lab{font:400 22px 'Architects Daughter';fill:#6b5a3a}
.cl{font:400 20px 'Architects Daughter';fill:#4a3f2a;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}.cl.s{font-size:15px}.sl{font:400 34px 'Schoolbell';fill:#5aa9c6}
.tl{pointer-events:none;opacity:0;transition:opacity .2s}.rt.on .tl{opacity:1}.tl text{font:400 13px 'Architects Daughter';fill:#333}.pin{cursor:pointer}.pin .b,.city .b{transition:transform .2s;transform-box:fill-box;transform-origin:50% 100%}.pin:hover .b,.pin.sel .b{transform:scale(1.25) translateY(-4px)}.city:hover .b{transform:scale(1.4)}.pin.sel rect,.pin.sel path{fill:#758d15}
#ht{transition:transform .25s;transform-box:fill-box;transform-origin:center}#ht:hover{transform:scale(1.2)}
.pulse{fill:#f39200;animation:pu 2s infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.7);opacity:0}}
.rt{cursor:pointer;transition:opacity .25s}.hit{stroke:transparent;stroke-width:24;fill:none}.ln,.hit{vector-effect:non-scaling-stroke}.ln{fill:none;stroke-width:2.4;stroke-dasharray:5 6;stroke-linecap:round;transition:stroke-width .2s}
.rt.on .ln{stroke-width:4;animation:dash 1s linear infinite}#outer.hl .rt:not(.on){opacity:.25}@keyframes dash{to{stroke-dashoffset:-22}}#outer.focus .rt:not(.on){opacity:0;pointer-events:none}.cw,.deco{transition:opacity .4s}#outer.focus .cw:not(.in){opacity:.1}#outer.focus .deco{opacity:.35}
.rvw{fill:#8fd3ec;stroke:#bfe6f5;stroke-width:1.5}.rvh{fill:none;stroke:#effbff;stroke-width:1.4;stroke-linecap:round;animation:sh 3.5s ease-in-out infinite alternate}@keyframes sh{from{opacity:.2}to{opacity:.9}}
.sea path,.lw{fill:none;stroke:#fff;stroke-width:2.5;opacity:.85;animation:wv 3s ease-in-out infinite alternate}.wave{animation:wv 2.2s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(10px)}}

#leg{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(0,0,0,.15);transition:opacity .3s;max-width:calc(100vw - 28px)}#leg ul{max-height:50vh;overflow:auto;padding:4px 10px 10px!important}#legb{width:100%;text-align:left}
#leg ul{list-style:none;margin:0;padding:0}#leg li{cursor:pointer;font-size:15px;padding:3px 4px;display:flex;align-items:center;gap:8px}#leg li:hover,#leg li.on{background:#eef3dc}#leg i{width:26px;height:6px;border-radius:3px;flex:none}#leg small{color:#9a9a9a;margin-left:auto;padding-left:10px;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0a0808cc;color:#fff;padding:6px 14px;font-size:15px;pointer-events:none}
.zb{background:#758d15;color:#fff;border:0;padding:8px 12px;font:400 17px 'Schoolbell';cursor:pointer}.zb:hover{background:#7ad03a}
aside{position:fixed;top:80px;right:16px;width:min(360px,calc(100vw - 32px));background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:20px;transform:translateX(120%);transition:transform .35s;z-index:5}aside.on{transform:none}
aside h2{margin:0 0 12px;font:400 28px 'Schoolbell';color:#758d15;text-transform:uppercase;padding-right:20px}aside .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:24px;cursor:pointer;color:#999}
#gal{position:relative;aspect-ratio:4/3;background:#eee}#gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}#gal img.on{opacity:1}
aside p{font-size:17px;line-height:1.6}.btn{display:inline-block;text-decoration:none;background:#758d15;color:#fff;border:0;padding:10px 16px;font:400 19px 'Schoolbell';text-transform:uppercase;cursor:pointer}.btn:hover{background:#7ad03a}
#scene{position:fixed;inset:0;background:#000;z-index:10;display:none}#scene.on{display:block}#scene video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#sc{position:fixed;inset:0;overflow-y:auto}#sc .tall{height:500vh}#sc h3{position:sticky;top:40%;margin:0;text-align:center;font:400 46px 'Schoolbell';color:#fff;text-shadow:0 2px 12px #000;padding-top:30vh}#scene .x{position:fixed;top:16px;right:16px;z-index:11}
@media(max-width:700px){header h1{font-size:18px}#leg{max-height:30vh;font-size:13px}#hint{display:none}}
</style></head><body>
<header><img src="assets/img/png_trns_logo.png" alt="Happy Tuscany"><h1>MAPPA <span>DEI TOUR</span></h1><button class="zb" id="zout">− Toscana</button><button class="zb" id="zin">+ La casa</button></header>
<div id="wrap">%OUTER%<div id="innerL">%INNER%</div>
<div id="leg"><ul id="legu" hidden>%LEG%</ul><button class="zb" id="legb">Itinerari ▴</button></div><div id="hint">Scrolla per entrare in Happy Tuscany · passa sui percorsi</div></div>
<aside id="panel"><button class="x" onclick="closeP()">×</button><h2 id="pt"></h2><div id="gal"></div><p id="pp"></p><div id="pb"></div></aside>
<div id="scene"><video id="v" muted playsinline preload="auto"></video><div id="sc"><div class="tall"><h3>Vieni come ospite,<br>riparti come amico.</h3></div></div><button class="btn x" onclick="closeScene()">× Mappa</button></div>
<script>
const D=%DATA%,TD=%TOURS%,HX=%HX%,HY=%HY%;const $=id=>document.getElementById(id);
const outer=$('outer'),og=$('og'),innerL=$('innerL'),leg=$('leg'),hint=$('hint'),panel=$('panel');let Z=0,Zt=0,galT,mode=0;const VB0=%VB%;let VB=VB0.slice(),VBt=VB0.slice();$('legb').onclick=()=>{const u=$('legu');u.hidden=!u.hidden;$('legb').textContent=u.hidden?'Itinerari ▴':'Itinerari ▾'};
$('wrap').addEventListener('wheel',e=>{if(panel.classList.contains('on')&&panel.contains(e.target))return;e.preventDefault();Zt=Math.min(1,Math.max(0,Zt-e.deltaY*0.0012))},{passive:false});
$('zin').onclick=()=>Zt=1;$('zout').onclick=()=>Zt=0;$('ht').onclick=()=>Zt=1;
function frame(){VB=VB.map((v,i)=>v+(VBt[i]-v)*.08);outer.setAttribute('viewBox',VB.map(v=>v.toFixed(1)).join(' '));Z+=(Zt-Z)*.1;if(Math.abs(Zt-Z)<.0005)Z=Zt;const s=1+Z*Z*14;og.setAttribute('transform',`translate(${HX},${HY}) scale(${s}) translate(${-HX},${-HY})`);
const f=Math.min(1,Math.max(0,(Z-.7)/.3));outer.style.opacity=1-f;innerL.style.opacity=f;innerL.style.transform=`scale(${.35+.65*f})`;
const m=f>.9?1:0;if(m!==mode){mode=m;closeP();innerL.style.pointerEvents=m?'auto':'none';outer.style.pointerEvents=m?'none':'auto';leg.style.opacity=m?0:1;leg.style.pointerEvents=m?'none':'auto';hint.textContent=m?'Scrolla indietro per tornare alla Toscana':'Scrolla per entrare in Happy Tuscany · passa sui percorsi'}
requestAnimationFrame(frame)}frame();
const rts=[...document.querySelectorAll('.rt')],lis=[...leg.querySelectorAll('li')];
function hl(s){outer.classList.toggle('hl',!!s);rts.forEach(r=>r.classList.toggle('on',r.dataset.t===s));lis.forEach(l=>l.classList.toggle('on',l.dataset.t===s))}
let sel=null;[...rts,...lis].forEach(el=>{el.addEventListener('mouseenter',()=>hl(el.dataset.t));el.addEventListener('mouseleave',()=>hl(sel));el.addEventListener('click',()=>openTour(el.dataset.t))});
function gallery(list){const g=$('gal');g.innerHTML='';clearInterval(galT);list.forEach((n,i)=>{const im=new Image();im.src=n;if(!i)im.className='on';g.appendChild(im)});
if(list.length>1){let k=0;galT=setInterval(()=>{const a=g.querySelectorAll('img');a[k].classList.remove('on');k=(k+1)%a.length;a[k].classList.add('on')},3000)}}
function openTour(s){const t=TD[s];$('legu').hidden=true;$('legb').textContent='Itinerari ▴';sel=s;hl(s);$('pt').textContent=t.t;$('pp').innerHTML=t.desc+'<br><b>Percorso:</b> Happy Tuscany → '+t.legs.join(' → ')+'<br><b>Totale A/R:</b> circa '+t.tot+' km, '+t.h+' h di auto · '+t.when;gallery(t.imgs);$('pb').innerHTML='';
outer.classList.add('focus');document.querySelectorAll('.cw').forEach(c=>c.classList.toggle('in',t.st.includes(c.dataset.n)));
let [x0,y0,x1,y1]=t.bb;const pw=Math.min(380,innerWidth*.9)/innerWidth;let w=Math.max(x1-x0,260)*1.25,h=Math.max(y1-y0,200)*1.35;const cx=(x0+x1)/2,cy=(y0+y1)/2;const ar=innerWidth/(innerHeight-64);if(w/h<ar)w=h*ar;else h=w/ar;const ex=w*pw/(1-pw);VBt=[cx-w/2,cy-h/2,w+ex,h];panel.classList.add('on')}
const pins=[...document.querySelectorAll('#inner .pin')];pins.forEach(p=>p.addEventListener('click',()=>openP(p.dataset.id)));
function openP(id){const d=D[id];pins.forEach(p=>p.classList.toggle('sel',p.dataset.id===id));$('pt').textContent=d.t;$('pp').textContent=d.txt;gallery(d.imgs.map(n=>'assets/img/'+n+'.webp'));
$('pb').innerHTML='';if(d.video){const x=document.createElement('button');x.className='btn';x.textContent='▶ Entra nella scena';x.onclick=openScene;$('pb').appendChild(x)}panel.classList.add('on')}
function closeP(){VBt=VB0.slice();outer.classList.remove('focus');panel.classList.remove('on');pins.forEach(p=>p.classList.remove('sel'));clearInterval(galT);sel=null;hl(null)}
const scene=$('scene'),v=$('v'),sc=$('sc');let loaded=0,ready=0,run=0,shown=0;
function openScene(){closeP();scene.classList.add('on');sc.scrollTop=0;shown=0;run=1;if(!loaded){loaded=1;const s=matchMedia('(max-aspect-ratio: 1/1)').matches?'assets/video/clip01_mobile.mp4':'assets/video/clip01_desktop.mp4';
fetch(s).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);v.addEventListener('loadeddata',()=>{ready=1;v.currentTime=0},{once:true})})}requestAnimationFrame(loop)}
function loop(){if(!run)return;if(ready&&v.duration){const f=sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);const t=f*(v.duration-.05);shown+=(t-shown)*.15;if(Math.abs(v.currentTime-shown)>.01)v.currentTime=shown}requestAnimationFrame(loop)}
function closeScene(){run=0;scene.classList.remove('on')}
const TREES=%TREES%,NS='http://www.w3.org/2000/svg',sqL=$('sqL');
const SQ='<g class="bd"><path class="tail" d="M-4,-4 C-15,-6 -19,-17 -12,-25 C-7,-29 -1,-26 -4,-20 C-6,-14 -2,-10 -4,-4Z" fill="#b5652c"/><path d="M-12,-25 C-7,-29 -1,-26 -4,-20" fill="none" stroke="#e0a066" stroke-width="2"/><ellipse cx="2" cy="-6" rx="7" ry="5" fill="#a85a26"/><ellipse cx="4" cy="-4" rx="3" ry="2" fill="#e6b48a"/><circle cx="9" cy="-11" r="3.6" fill="#a85a26"/><path d="M7.5,-14 l1,-4 l2.2,3z" fill="#a85a26"/><circle cx="10.6" cy="-11.6" r=".9" fill="#111"/><path d="M5,-2 v3 M-1,-2 v3" stroke="#7a3f18" stroke-width="2"/></g>';
const rnd=(a,b)=>a+Math.random()*(b-a);const S=[0,1].map(()=>{const g=document.createElementNS(NS,'g');g.innerHTML=SQ;g.style.opacity=0;sqL.appendChild(g);return{g,tail:g.querySelector('.tail'),x:0,y:0,dir:1,st:'hidden',t:rnd(.5,3),tx:0,ty:0,ph:0,rot:0,op:0}});
function nearTree(x,y,r){const c=TREES.filter(p=>Math.hypot(p[0]-x,p[1]-y)<r);return c.length?c[Math.floor(Math.random()*c.length)]:TREES[Math.floor(Math.random()*TREES.length)]}
let last=performance.now();function sqLoop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
for(const q of S){q.t-=dt;let bob=0,ta=0;
if(q.st==='hidden'){q.op=0;if(q.t<=0){const p=TREES[Math.floor(Math.random()*TREES.length)];q.x=p[0];q.y=p[1];q.st='down';q.t=.9}}
else if(q.st==='down'){const k=1-q.t/.9;q.op=Math.min(1,k*2);q.rot=90*(1-k)*q.dir;bob=-40*(1-k);if(q.t<=0){q.st='pause';q.t=rnd(.4,1.4);q.rot=0}}
else if(q.st==='pause'){ta=Math.sin(now/70)*12*(q.t%0.6<.3?1:0);if(q.t<=0){if(Math.random()<.25){const p=nearTree(q.x,q.y,160);q.tx=p[0];q.ty=p[1];q.st='run';q.goUp=1}else{q.tx=q.x+rnd(-80,80);q.ty=q.y+rnd(-30,30);q.st='run';q.goUp=0}q.dir=q.tx>=q.x?1:-1;q.leg=rnd(25,60)}}
else if(q.st==='run'){const dx=q.tx-q.x,dy=q.ty-q.y,d=Math.hypot(dx,dy),s=150*dt;q.ph+=dt*18;bob=-Math.abs(Math.sin(q.ph))*5;ta=Math.sin(q.ph)*8;q.leg-=s;
if(d<=s){q.x=q.tx;q.y=q.ty;if(q.goUp){q.st='up';q.t=.9}else{q.st='pause';q.t=rnd(.5,1.8)}}else{q.x+=dx/d*s;q.y+=dy/d*s;if(q.leg<=0){q.st='pause';q.t=rnd(.2,.8);q.tx2=q.tx;q.ty2=q.ty;q.resume=1}}}
else if(q.st==='up'){const k=1-q.t/.9;q.rot=-90*q.dir*Math.min(1,k*3);bob=-45*k;q.op=1-Math.max(0,(k-.5)*2);if(q.t<=0){q.st='hidden';q.t=rnd(2,6)}}
if(q.st==='pause'&&q.resume&&q.t<=0){}
q.g.style.opacity=q.op;q.g.setAttribute('transform',`translate(${q.x.toFixed(1)},${(q.y+bob).toFixed(1)}) rotate(${q.rot}) scale(${q.dir},1)`);q.tail.setAttribute('transform',`rotate(${ta.toFixed(1)} -4 -4)`)}
requestAnimationFrame(sqLoop)}requestAnimationFrame(sqLoop);
const rdp=$('rdp'),RL=rdp.getTotalLength(),ZL=[...document.querySelectorAll('#inner .zl')].map(g=>[+g.dataset.y,g]);
const CARS=[...document.querySelectorAll('#inner .car')].map(e=>({e,s:((+e.dataset.s)%RL+RL)%RL,v:+e.dataset.v,d:+e.dataset.dir}));
let lc=performance.now();function carLoop(now){const dt=Math.min(.05,(now-lc)/1000);lc=now;for(const c of CARS){c.s=((c.s+c.v*c.d*dt)%RL+RL)%RL;const p=rdp.getPointAtLength(c.s),q=rdp.getPointAtLength(Math.min(RL,Math.max(0,c.s+c.d*3)));let dx=q.x-p.x,dy=q.y-p.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const x=p.x-dy*5,y=p.y+dx*5;
c.e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.atan2(dy,dx)*180/Math.PI).toFixed(1)})`);let band=ZL[0][1];for(const [by,g] of ZL){if(by<=y-4)band=g;else break}if(c.e.parentNode!==band)band.appendChild(c.e)}requestAnimationFrame(carLoop)}requestAnimationFrame(carLoop);
</script></body></html>
