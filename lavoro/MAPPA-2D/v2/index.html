#scene{position:fixed;inset:0;background:#000;z-index:10;display:none}#scene.on{display:block}#scene video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#sc{position:fixed;inset:0;overflow-y:auto}#sc .tall{height:500vh}#sc h3{position:sticky;top:40%;margin:0;text-align:center;font:400 46px 'Schoolbell';color:#fff;text-shadow:0 2px 12px #000;padding-top:30vh}
#scene .x{position:fixed;top:16px;right:16px;z-index:11}

<aside id="panel"><button class="x" onclick="closeP()">×</button><h2 id="pt"></h2><div id="gal"></div><p id="pp"></p><div id="pb"></div></aside>
<div id="scene"><video id="v" muted playsinline preload="auto"></video><div id="sc"><div class="tall"><h3>Vieni come ospite,<br>riparti come amico.</h3></div></div><button class="btn x" onclick="closeScene()">× Mappa</button></div>
<script>
const D={"casa": {"t": "Happy Tuscany", "txt": "Casa vacanze in collina, Via della Croce 200, Rigomagno (SI). Tocca \"Entra nella proprietà\" per vedere piscina, terrazza e servizi.", "imgs": ["si2", "Bordo-piscina", "WhatsApp-Image-2025-06-06-at-15.11.05"], "video": 0, "zoom": 1}, "borgo": {"t": "Borgo di Rigomagno", "txt": "Il borgo di Rigomagno, a circa 608 m in linea d'aria dalla casa, lungo Via della Croce.", "imgs": [], "video": 0, "zoom": 0}, "stazione": {"t": "Stazione di Rigomagno", "txt": "Stazione di Rigomagno, linea Siena–Chiusi: circa 412 m in linea d'aria. Accanto passa il raccordo Siena–Bettolle.", "imgs": [], "video": 0, "zoom": 0}, "vista": {"t": "Vista sulla Valdichiana", "txt": "In posizione collinare, la casa offre una vista mozzafiato unica sul paesaggio toscano della Valdichiana.", "imgs": ["WhatsApp-Image-2025-05-09-at-00.14.06-5", "si2"], "video": 0, "zoom": 0}, "piscina": {"t": "Piscina panoramica", "txt": "Piscina privata immersa tra gli ulivi, con deck in legno e vista aperta sulla campagna toscana.", "imgs": ["Bordo-piscina", "si2"], "video": 1, "zoom": 0}, "jacuzzi": {"t": "Idromassaggio con vista", "txt": "Concediti un momento di puro relax nell'idromassaggio all'aperto, immerso nel verde e affacciato sulle dolci colline toscane.", "imgs": ["b0a43d67-86dc-4e6f-a48c-304c055224b2"], "video": 0, "zoom": 0}, "terrazza": {"t": "Terrazza e amaca", "txt": "Terrazza attrezzata con vista mozzafiato, amaca e una grande zona dedicata a cene all'aperto.", "imgs": ["WhatsApp-Image-2025-06-06-at-15.11.05-1", "WhatsApp-Image-2025-06-18-at-14.19.38", "WhatsApp-Image-2025-06-06-at-15.11.05"], "video": 0, "zoom": 0}, "barbecue": {"t": "Barbecue e asado", "txt": "Barbecue in muratura e asado alla brace per grigliate conviviali.", "imgs": ["Cruz", "WhatsApp-Image-2025-06-21-at-07.19.31-3", "WhatsApp-Image-2025-06-21-at-07.19.31-4"], "video": 0, "zoom": 0}, "musica": {"t": "Musica e karaoke", "txt": "Musica, videoproiezioni e karaoke per le serate all'aperto.", "imgs": ["WhatsApp-Image-2025-06-21-at-07.19.30-3", "WhatsApp-Image-2025-06-21-at-07.19.31-1"], "video": 0, "zoom": 0}, "ingresso": {"t": "Ingresso e parcheggio", "txt": "Vialetto in pietra illuminato e spazio per parcheggiare davanti alla casa.", "imgs": ["WhatsApp-Image-2025-06-06-at-15.11.04-1", "WhatsApp-Image-2025-06-21-at-07.19.30-1"], "video": 0, "zoom": 0}, "interni": {"t": "La casa", "txt": "Tre camere: due matrimoniali con bagno privato e aria condizionata, di cui una con splendida vista panoramica; la terza con letti singoli unibili. Salone per oltre 30 persone.", "imgs": ["Tavolone", "WhatsApp-Image-2025-06-06-at-15.11.05-3", "Stufa-2", "WhatsApp-Image-2025-05-09-at-00.14.05-4"], "video": 0, "zoom": 0}};const panel=document.getElementById('panel'),pins=[...document.querySelectorAll('.pin')];let galT;
pins.forEach(p=>p.addEventListener('click',()=>openP(p.dataset.id)));
function openP(id){const d=D[id];pins.forEach(p=>p.classList.toggle('sel',p.dataset.id===id));pt.textContent=d.t;pp.textContent=d.txt;gal.innerHTML='';clearInterval(galT);
d.imgs.forEach((n,i)=>{const im=new Image();im.src='assets/img/'+n+'.webp';im.alt=d.t;if(!i)im.className='on';gal.appendChild(im)});
if(d.imgs.length>1){let k=0;galT=setInterval(()=>{const a=gal.querySelectorAll('img');a[k].classList.remove('on');k=(k+1)%a.length;a[k].classList.add('on')},3000)}
pb.innerHTML='';if(d.video){const x=document.createElement('button');x.className='btn';x.textContent='▶ Entra nella scena';x.onclick=openScene;pb.appendChild(x)}panel.classList.add('on')}
function closeP(){panel.classList.remove('on');pins.forEach(p=>p.classList.remove('sel'));clearInterval(galT)}
const scene=document.getElementById('scene'),v=document.getElementById('v'),sc=document.getElementById('sc');let loaded=0,ready=0,run=0,shown=0;
function openScene(){closeP();scene.classList.add('on');sc.scrollTop=0;shown=0;run=1;if(!loaded){loaded=1;const s=matchMedia('(max-aspect-ratio: 1/1)').matches?'assets/video/clip01_mobile.mp4':'assets/video/clip01_desktop.mp4';
fetch(s).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);v.addEventListener('loadeddata',()=>{ready=1;v.currentTime=0},{once:true})})}requestAnimationFrame(loop)}
function loop(){if(!run)return;if(ready&&v.duration){const f=sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);const t=f*(v.duration-.05);shown+=(t-shown)*.15;if(Math.abs(v.currentTime-shown)>.01)v.currentTime=shown}requestAnimationFrame(loop)}
function closeScene(){run=0;scene.classList.remove('on')}
</script></body></html>
