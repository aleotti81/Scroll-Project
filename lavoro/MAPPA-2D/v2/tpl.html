<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Tuscany – Mappa</title>
<style>%FACES%
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:'Architects Daughter',cursive;color:#333}
header{height:64px;background:#0a0808;display:flex;align-items:center;gap:16px;padding:0 24px}header img{height:40px}header h1{margin:0;font:400 26px 'Schoolbell';color:#fff}header h1 span{color:#758d15}
#wrap{height:calc(100vh - 64px);overflow:auto}#map{width:100%;height:100%;display:block;min-width:900px}
.ic{font-family:'%FA%';font-size:21px;fill:#fff}.ban{font:400 26px 'Schoolbell';fill:#fff;letter-spacing:1px}.lab{font:400 22px 'Architects Daughter';fill:#6b5a3a}
.pin{cursor:pointer}.pin .b{transition:transform .2s}.pin:hover .b,.pin.sel .b{transform:translateY(-8px)}.pin.sel rect,.pin.sel path{fill:#758d15}
aside{position:fixed;top:80px;right:16px;width:min(360px,calc(100vw - 32px));background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:20px;transform:translateX(120%);transition:transform .35s;z-index:5}aside.on{transform:none}
aside h2{margin:0 0 12px;font:400 30px 'Schoolbell';color:#758d15;text-transform:uppercase}aside .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:24px;cursor:pointer;color:#999}
#gal{position:relative;aspect-ratio:4/3;background:#eee}#gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}#gal img.on{opacity:1}
aside p{font-size:17px;line-height:1.7}.btn{background:#758d15;color:#fff;border:0;padding:10px 16px;font:400 19px 'Schoolbell';text-transform:uppercase;cursor:pointer}.btn:hover{background:#7ad03a}
#scene{position:fixed;inset:0;background:#000;z-index:10;display:none}#scene.on{display:block}#scene video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#sc{position:fixed;inset:0;overflow-y:auto}#sc .tall{height:500vh}#sc h3{position:sticky;top:40%;margin:0;text-align:center;font:400 46px 'Schoolbell';color:#fff;text-shadow:0 2px 12px #000;padding-top:30vh}
#scene .x{position:fixed;top:16px;right:16px;z-index:11}
</style></head><body>
<header><img src="assets/img/png_trns_logo.png" alt="Happy Tuscany"><h1>MAPPA <span>INTERATTIVA</span></h1></header>
<div id="wrap">%SVG%</div>
<aside id="panel"><button class="x" onclick="closeP()">×</button><h2 id="pt"></h2><div id="gal"></div><p id="pp"></p><div id="pb"></div></aside>
<div id="scene"><video id="v" muted playsinline preload="auto"></video><div id="sc"><div class="tall"><h3>Vieni come ospite,<br>riparti come amico.</h3></div></div><button class="btn x" onclick="closeScene()">× Mappa</button></div>
<script>
const D=%DATA%;const panel=document.getElementById('panel'),pins=[...document.querySelectorAll('.pin')];let galT;
pins.forEach(p=>p.addEventListener('click',()=>openP(p.dataset.id)));
function openP(id){const d=D[id];pins.forEach(p=>p.classList.toggle('sel',p.dataset.id===id));pt.textContent=d.t;pp.textContent=d.txt;gal.innerHTML='';clearInterval(galT);
d.imgs.forEach((n,i)=>{const im=new Image();im.src='assets/img/'+n+'.webp';im.alt=d.t;if(!i)im.className='on';gal.appendChild(im)});
if(d.imgs.length>1){let k=0;galT=setInterval(()=>{const a=gal.querySelectorAll('img');a[k].classList.remove('on');k=(k+1)%a.length;a[k].classList.add('on')},3000)}
pb.innerHTML='';if(d.video){const x=document.createElement('button');x.className='btn';x.textContent='▶ Entra nella scena';x.onclick=openScene;pb.appendChild(x)}panel.classList.add('on')}
function closeP(){panel.classList.remove('on');pins.forEach(p=>p.classList.remove('sel'));clearInterval(galT)}
const scene=document.getElementById('scene'),v=document.getElementById('v'),sc=document.getElementById('sc');let loaded=0,ready=0,run=0,shown=0;
function openScene(){closeP();scene.classList.add('on');sc.scrollTop=0;shown=0;run=1;if(!loaded){loaded=1;const s=matchMedia('(max-aspect-ratio: 1/1)').matches?'assets/video/clip01_mobile.mp4':'assets/video/clip01_desktop.mp4';
fetch(s).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b);v.addEventListener('loadeddata',()=>{ready=1;v.currentTime=0},{once:true})})}requestAnimationFrame(loop)}
function loop(){if(!run)return;if(ready&&v.duration){const f=sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);const t=f*(v.duration-.05);shown+=(t-shown)*.15;if(Math.abs(v.currentTime-shown)>.01)v.currentTime=shown}requestAnimationFrame(loop)}
function closeScene(){run=0;scene.classList.remove('on')}
</script></body></html>
